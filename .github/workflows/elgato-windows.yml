name: TackleCast v3.0.0 Elgato Windows x64

on:
  push:
    branches: [elgato-1440p-v3.0.0]
    paths: [.github/workflows/elgato-windows.yml]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.93.1
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Windows runtime dependencies
        shell: powershell
        run: .\scripts\setup_windows_dependencies.ps1 -IncludeGpuRuntime
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/rife/requirements-build.txt
      - name: Prepare complete pinned RIFE payload
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r scripts/rife/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Model build dependencies failed' }
          python scripts/setup_framegen.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned frame-generation preparation failed' }
      - name: Build and verify Windows x64 release
        shell: powershell
        env:
          PATCHED_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting check failed' }
          .\scripts\package_rust_release.ps1 -PackageName TackleCast-Windows-x86_64 -RequireGpuDlls -RequireFrameGen -Zip
          $archive = 'dist/TackleCast-Windows-x86_64.zip'
          Expand-Archive -LiteralPath $archive -DestinationPath dist/extracted-windows
          python scripts/verify_package.py --package dist/extracted-windows --require-gpu --require-framegen --commit $env:PATCHED_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
          python scripts/smoke_test.py --binary dist/extracted-windows/TackleCast.exe
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic rendering failed' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii -LiteralPath "$archive.sha256" -Value "$hash  TackleCast-Windows-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TackleCast-v3.0.0-Elgato-Windows-x64
          path: |
            dist/TackleCast-Windows-x86_64.zip
            dist/TackleCast-Windows-x86_64.zip.sha256
          if-no-files-found: error
